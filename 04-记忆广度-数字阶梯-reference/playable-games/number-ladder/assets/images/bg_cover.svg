<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7F1FF"/>
      <stop offset="0.32" stop-color="#79CBE1"/>
      <stop offset="0.70" stop-color="#3F99BA"/>
      <stop offset="1" stop-color="#1D6884"/>
    </linearGradient>
    <radialGradient id="light" cx=".36" cy=".18" r=".62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".82"/>
      <stop offset=".34" stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubble" cx=".32" cy=".24" r=".78">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".93"/>
      <stop offset=".42" stop-color="#D9FAFF" stop-opacity=".48"/>
      <stop offset="1" stop-color="#8ED7E7" stop-opacity=".12"/>
    </radialGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="1" stop-color="#82FFE3" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#E8FEFF"/>
      <stop offset="1" stop-color="#A9F8ED"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0D4054" flood-opacity=".25"/>
    </filter>
    <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0B5165" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#light)"/>
  <g class="waveA" opacity=".42" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="3">
    <path d="M-80 182 C 220 80, 450 290, 760 172 S 1300 94, 2020 190"/>
    <path d="M-120 318 C 180 232, 520 392, 840 292 S 1320 210, 2010 320" opacity=".55"/>
  </g>
  <g class="waveB" opacity=".25" fill="none" stroke="#B9FFF2" stroke-width="2">
    <path d="M-90 500 C 260 405, 440 600, 750 510 S 1260 420, 2020 515"/>
    <path d="M-90 650 C 250 575, 520 735, 880 660 S 1350 585, 2020 670" opacity=".55"/>
  </g>
  <g filter="url(#softShadow)" opacity=".72">
    <circle cx="278" cy="770" r="44" fill="url(#bubble)"/>
    <circle cx="1580" cy="255" r="62" fill="url(#bubble)"/>
    <circle cx="1660" cy="820" r="35" fill="url(#bubble)"/>
    <circle cx="432" cy="250" r="28" fill="url(#bubble)"/>
    <circle cx="1220" cy="615" r="24" fill="url(#bubble)"/>
  </g>
  <g opacity=".36" fill="#FFFFFF">
    <circle cx="180" cy="180" r="8"/><circle cx="245" cy="145" r="4"/><circle cx="1725" cy="450" r="7"/><circle cx="1522" cy="610" r="5"/><circle cx="1110" cy="206" r="6"/><circle cx="820" cy="804" r="5"/>
  </g>
  <g class="stepGlow" transform="translate(534 585)" filter="url(#softShadow)">
    <rect x="0" y="220" width="178" height="46" rx="18" fill="url(#step)"/>
    <rect x="155" y="170" width="190" height="46" rx="18" fill="url(#step)"/>
    <rect x="322" y="120" width="205" height="46" rx="18" fill="url(#step)"/>
    <rect x="505" y="70" width="218" height="46" rx="18" fill="url(#step)"/>
    <rect x="700" y="20" width="236" height="46" rx="18" fill="url(#step)"/>
  </g>
  <g filter="url(#titleShadow)"><text x="960" y="278" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="124" font-weight="800" letter-spacing="18" fill="url(#titleGrad)">数字阶梯</text><text x="960" y="342" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="600" fill="rgba(239,252,255,.92)">按数字从小到大点击气泡</text></g>

</svg>