<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数字阶梯｜三难度终检版</title>
  <link rel="icon" href="assets/images/app_icon_128.png">
  <style>
:root {
  --panel: rgba(255,255,255,.86);
  --line: rgba(32, 74, 92, .18);
  --text: #17313b;
  --muted: #55717c;
  --bubble: rgba(255,255,255,.96);
  --bubble-border: rgba(115,190,219,.95);
  --bubble-green: #67c779;
  --bubble-red: #ef6b63;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); }
body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 16% 18%, rgba(255,255,255,.55), transparent 18%),
    radial-gradient(circle at 82% 24%, rgba(255,255,255,.35), transparent 20%),
    linear-gradient(180deg, #9ed8ec 0%, #70b8d2 38%, #3e91b3 100%);
  overflow: hidden;
}
.screen { position: fixed; inset: 0; display: none; }
.screen.active { display: block; }
.sr-only {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.center-screen { display: none; place-items: center; padding: 24px; }
.center-screen.active { display: grid; }
.card {
  width: min(680px, calc(100vw - 32px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 28px;
  padding: 32px;
  box-shadow: 0 18px 46px rgba(24, 72, 92, .22);
  text-align: center;
  backdrop-filter: blur(8px);
}
h1 { margin: 0 0 10px; font-size: clamp(36px, 7vw, 72px); letter-spacing: .08em; }
h2 { margin: 0 0 12px; font-size: 30px; }
p { line-height: 1.7; }
button {
  appearance: none;
  border: 0;
  border-radius: 999px;
  padding: 12px 22px;
  margin: 8px;
  background: #23566b;
  color: white;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(35, 86, 107, .22);
}
button.secondary { background: rgba(35, 86, 107, .12); color: #214858; box-shadow: none; }
button:disabled { opacity: .5; cursor: not-allowed; }
.small { font-size: 13px; color: var(--muted); }
#gameScreen { padding: 18px; }
#hud {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
  align-items: center;
  width: min(1180px, calc(100vw - 36px));
  margin: 0 auto 10px;
}
.hud-item {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 10px 12px;
  min-height: 58px;
  box-shadow: 0 8px 20px rgba(28, 83, 107, .11);
}
.hud-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.hud-value { font-size: 22px; font-weight: 700; }
#pauseBtn { width: 100%; height: 48px; margin: 0; }
#promptBar {
  width: min(920px, calc(100vw - 36px));
  margin: 8px auto 12px;
  background: rgba(255,255,255,.78);
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 18px;
  padding: 12px 18px;
  font-size: 18px;
  text-align: center;
}
#playArea {
  position: relative;
  width: min(1120px, calc(100vw - 36px));
  height: calc(100vh - 208px);
  min-height: 420px;
  margin: 0 auto;
  border-radius: 30px;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 115%, rgba(15, 92, 87, .32), transparent 52%),
    radial-gradient(circle at 10% 80%, rgba(255,255,255,.22), transparent 16%),
    linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.04));
  border: 1px solid rgba(255,255,255,.42);
  box-shadow: inset 0 0 34px rgba(255,255,255,.25), 0 18px 40px rgba(20, 83, 112, .16);
}
#playArea::after {
  content: "";
  position: absolute;
  inset: auto -10% -14% -10%;
  height: 28%;
  background: radial-gradient(ellipse at center, rgba(31, 106, 85, .28), transparent 60%);
  pointer-events: none;
}
.bubble {
  position: absolute;
  width: 82px;
  height: 82px;
  border-radius: 999px;
  transform: translate(-50%, 80vh) scale(.85);
  display: grid;
  place-items: center;
  padding: 8px;
  background: var(--bubble);
  border: 3px solid var(--bubble-border);
  color: #14313d;
  font-weight: 750;
  font-size: 26px;
  line-height: 1;
  user-select: none;
  cursor: pointer;
  box-shadow: inset -9px -10px 20px rgba(94, 160, 190, .18), inset 8px 8px 16px rgba(255,255,255,.9), 0 16px 24px rgba(33, 102, 130, .22);
  animation: rise .54s cubic-bezier(.2,.86,.22,1) forwards;
  transition: transform .18s ease, opacity .22s ease, background .18s ease, border-color .18s ease;
}
.bubble::before {
  content: "";
  position: absolute;
  width: 22%;
  height: 22%;
  left: 20%;
  top: 17%;
  border-radius: 50%;
  background: rgba(255,255,255,.75);
}
.bubble.operation { width: 128px; border-radius: 42px; font-size: 22px; }
.bubble.decimal { width: 104px; font-size: 23px; }
.bubble:hover { transform: translate(-50%, -50%) scale(1.05); }
.bubble.correct { background: var(--bubble-green); border-color: #35a84c; color: white; transform: translate(-50%, -50%) scale(1.12); }
.bubble.wrong { background: var(--bubble-red); border-color: #d64039; color: white; transform: translate(-50%, -50%) scale(1.08); }
.bubble.popped { opacity: 0; transform: translate(-50%, -50%) scale(.15); pointer-events: none; }
@keyframes rise { to { transform: translate(-50%, -50%) scale(1); } }
#statusDots {
  position: absolute;
  right: 28px;
  bottom: 20px;
  display: flex;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,.72);
  border: 1px solid var(--line);
  box-shadow: 0 8px 20px rgba(28, 83, 107, .14);
}
#statusDots .dot {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 2px solid #286277;
  color: #d9443c;
  font-size: 18px;
  font-weight: 800;
  line-height: 1;
}
#statusDots .dot.pass { background: #286277; }
#statusDots .dot.fail { border-color: #d9443c; }
.modal-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  background: rgba(16, 49, 63, .46);
  backdrop-filter: blur(5px);
  z-index: 20;
}
.modal-backdrop.active { display: grid; }
.modal { width: min(520px, calc(100vw - 32px)); background: var(--panel); border-radius: 26px; padding: 28px; text-align: center; box-shadow: 0 22px 52px rgba(16,49,63,.28); }
.modal-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; }
input[type="range"] { width: 220px; }
#guideStage { position: relative; height: 280px; margin: 10px 0 20px; border-radius: 22px; background: rgba(100, 181, 211, .2); border: 1px solid rgba(255,255,255,.45); overflow: hidden; }
.guide-bubble { top: 52%; }
.guide-bubble:first-child { left: 36%; }
.guide-bubble:last-child { left: 64%; }
.guide-highlight { outline: 5px solid rgba(255, 218, 91, .8); }
@media (max-width: 760px) {
  body { overflow: auto; }
  #hud { grid-template-columns: repeat(2, minmax(0,1fr)); }
  #gameScreen { padding-bottom: 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #playArea {
    height: 500px;
    height: clamp(430px, calc(100dvh - 344px), 560px);
    min-height: 430px;
  }
  #statusDots { right: 18px; bottom: 16px; }
  .bubble { width: 68px; height: 68px; font-size: 22px; }
  .bubble.operation { width: 104px; height: 64px; font-size: 18px; }
  .bubble.decimal { width: 78px; height: 68px; font-size: 20px; }
}

/* 精致素材版视觉覆盖：不改变玩法逻辑，仅替换美术表现 */
:root {
  --panel: rgba(255,255,255,.88);
  --line: rgba(145, 230, 239, .42);
  --text: #143743;
  --muted: #53727b;
  --bubble: rgba(255,255,255,.96);
  --bubble-border: rgba(126,219,236,.95);
  --bubble-green: #4ed079;
  --bubble-red: #f0645e;
}
body {
  background: url("assets/images/bg_game.svg") center/cover fixed no-repeat;
}
.card, .modal, .hud-item, #promptBar {
  background: rgba(255,255,255,.82);
  border: 1px solid rgba(255,255,255,.58);
  box-shadow: 0 24px 54px rgba(13,69,90,.22), inset 0 1px 0 rgba(255,255,255,.75);
  backdrop-filter: blur(12px);
}
.game-logo { width: min(520px, 86vw); display:block; margin: 0 auto 6px; }
h1.logo-fallback { position:absolute; left:-9999px; }
button {
  background: linear-gradient(135deg,#247392,#123f55);
  box-shadow: 0 12px 26px rgba(15,76,99,.28), inset 0 1px 0 rgba(255,255,255,.24);
  border: 1px solid rgba(255,255,255,.22);
  font-weight: 700;
}
button.secondary {
  background: rgba(255,255,255,.58);
  border: 1px solid rgba(133,215,232,.78);
  color: #174354;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
}
#playArea, #guideStage {
  background: url("assets/images/bg_game.svg") center/cover no-repeat;
  border: 1px solid rgba(255,255,255,.46);
  box-shadow: inset 0 0 54px rgba(255,255,255,.24), 0 22px 48px rgba(12,76,102,.21);
}
.bubble {
  background: url("assets/sprites/bubble_white.svg") center/100% 100% no-repeat;
  border: none;
  box-shadow: none;
  color: #143743;
  text-shadow: 0 2px 0 rgba(255,255,255,.68);
}
.bubble::before { display:none; }
.bubble.operation { background-image: url("assets/sprites/bubble_operation_white.svg"); }
.bubble.correct { background-image: url("assets/sprites/bubble_green.svg"); color: #0d3b22; }
.bubble.operation.correct { background-image: url("assets/sprites/bubble_operation_green.svg"); }
.bubble.wrong { background-image: url("assets/sprites/bubble_red.svg"); color: white; text-shadow: 0 2px 0 rgba(120,20,18,.25); }
.bubble.operation.wrong { background-image: url("assets/sprites/bubble_operation_red.svg"); }
.guide-highlight { outline: none; filter: drop-shadow(0 0 18px rgba(255,220,88,.88)); }
#statusDots .dot.pass { background: #286277; box-shadow: inset 0 0 0 4px rgba(255,255,255,.24); }
#statusDots { background: rgba(255,255,255,.66); backdrop-filter: blur(8px); }


/* 三难度终检版：保留素材接入，修复多位数字排版，并增加移动端防重叠布局 */
#welcomeScreen {
  background: url("assets/images/bg_cover.svg") center/cover fixed no-repeat;
}
.cover-hero {
  display: block;
  width: min(520px, 88vw);
  aspect-ratio: 16 / 9;
  object-fit: cover;
  margin: 10px auto 16px;
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,.72);
  box-shadow: 0 18px 42px rgba(18,83,105,.20);
}
button:not(.bubble) { min-width: 122px; }
button:focus-visible, .bubble:focus-visible {
  outline: 4px solid rgba(255,224,102,.92);
  outline-offset: 3px;
}
.bubble {
  --bubble-scale: 1;
  --pop-size: 118px;
  min-width: 0;
  margin: 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  overflow: visible;
  will-change: transform, opacity;
}
.bubble.clicked,
.bubble:disabled {
  pointer-events: none;
}
.bubble.selected {
  background-image: url("assets/sprites/bubble_selected.svg");
}
.bubble.operation.selected {
  background-image: url("assets/sprites/bubble_operation_green.svg");
}
.bubble .value-token {
  position: relative;
  z-index: 2;
  display: block;
  max-width: calc(100% - 8px);
  white-space: nowrap;
  text-align: center;
  color: currentColor;
  font-family: ui-rounded, "Nunito Sans", "Inter", "Arial Rounded MT Bold", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "kern" 1;
  font-weight: 900;
  line-height: .9;
  letter-spacing: -.045em;
  text-rendering: geometricPrecision;
  transform: translateY(1px);
  pointer-events: none;
}
.bubble .value-token.len-1 { font-size: 31px; letter-spacing: 0; }
.bubble .value-token.len-2 { font-size: 31px; letter-spacing: -.055em; }
.bubble .value-token.len-3 { font-size: 27px; letter-spacing: -.06em; }
.bubble .value-token.len-4 { font-size: 24px; letter-spacing: -.065em; }
.bubble .value-token.len-5,
.bubble .value-token.len-6,
.bubble .value-token.len-7plus { font-size: 21px; letter-spacing: -.07em; }
.bubble.decimal .value-token { font-size: 27px; letter-spacing: -.055em; }
.bubble.operation .value-token { font-size: 25px; letter-spacing: -.06em; }
.bubble.operation .value-token.len-5 { font-size: 23px; }
.bubble.operation .value-token.len-6 { font-size: 21px; }
.bubble.operation .value-token.len-7plus { font-size: 19px; letter-spacing: -.075em; }
.pop-sprite {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--pop-size);
  height: var(--pop-size);
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 3;
  background: url("assets/sprites/bubble_pop_spritesheet.png") 0 0 / 800% 100% no-repeat;
  animation: bubblePopFrames .32s steps(8) forwards;
  filter: drop-shadow(0 12px 16px rgba(39,128,158,.24));
}
.bubble.operation .pop-sprite { --pop-size: 148px; }
@keyframes bubblePopFrames {
  to { background-position: -800% 0; opacity: 0; transform: translate(-50%, -50%) scale(1.08); }
}
#statusDots .dot {
  width: 28px;
  height: 28px;
  border: 0;
  background: url("assets/ui/dot_empty.png") center/contain no-repeat;
  color: transparent;
}
#statusDots .dot.current { background-image: url("assets/ui/dot_current.png"); }
#statusDots .dot.pass { background: url("assets/ui/dot_pass.png") center/contain no-repeat; }
#statusDots .dot.fail { background: url("assets/ui/dot_fail.png") center/contain no-repeat; }
.modal { max-height: calc(100vh - 44px); overflow: auto; }
.trend {
  margin-top: 14px;
  padding: 14px;
  border-radius: 18px;
  background: rgba(255,255,255,.58);
  border: 1px solid rgba(128,214,232,.42);
  text-align: left;
}
.trend h3 {
  margin: 0 0 8px;
  font-size: 16px;
}
.trend-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 8px 0 10px;
}
.trend-cell {
  border-radius: 14px;
  background: rgba(255,255,255,.62);
  padding: 8px;
  text-align: center;
  border: 1px solid rgba(255,255,255,.6);
}
.trend-cell strong { display:block; font-size: 18px; }
.trend-strip { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.trend-badge {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:28px;
  height:28px;
  padding:0 8px;
  border-radius:999px;
  background:rgba(32,98,119,.12);
  font-size:12px;
  font-weight:800;
}
.trend-badge.pass { background:rgba(62,190,111,.24); color:#12552b; }
.trend-badge.fail { background:rgba(237,91,84,.22); color:#8e211d; }
.difficulty-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin: 18px 0 12px;
}
button.difficulty-card {
  min-width: 0;
  width: 100%;
  min-height: 128px;
  margin: 0;
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  border-radius: 22px;
  color: #123f55;
  background:
    linear-gradient(180deg, rgba(255,255,255,.88), rgba(205,248,250,.76)),
    url("assets/ui/button_secondary.svg") center/cover no-repeat;
  border: 1px solid rgba(255,255,255,.72);
  box-shadow: 0 12px 28px rgba(28, 83, 107, .16), inset 0 1px 0 rgba(255,255,255,.86);
  text-align: center;
  white-space: normal;
}
button.difficulty-card:hover,
button.difficulty-card:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 18px 34px rgba(28, 83, 107, .24), inset 0 1px 0 rgba(255,255,255,.9);
  outline: 3px solid rgba(103, 214, 232, .42);
}
.difficulty-card strong {
  display: block;
  font-size: clamp(22px, 4.2vw, 30px);
  letter-spacing: .06em;
}
.difficulty-card span {
  display: block;
  font-size: 13px;
  line-height: 1.45;
  color: #55717c;
  font-weight: 700;
  letter-spacing: 0;
}
.difficulty-note {
  margin-top: 4px;
  padding: 10px 12px;
  border-radius: 16px;
  background: rgba(255,255,255,.58);
  border: 1px solid rgba(255,255,255,.62);
}
@media (max-width: 760px) {
  .cover-hero { width: min(420px, 86vw); }
  .trend-grid { grid-template-columns: 1fr; }
  .difficulty-grid { grid-template-columns: 1fr; }
  button.difficulty-card { min-height: 96px; }
  .bubble .value-token.len-1,
  .bubble .value-token.len-2 { font-size: 29px; letter-spacing: -.045em; }
  .bubble .value-token.len-3 { font-size: 25px; letter-spacing: -.055em; }
  .bubble .value-token.len-4 { font-size: 22px; letter-spacing: -.06em; }
  .bubble .value-token.len-5,
  .bubble .value-token.len-6,
  .bubble .value-token.len-7plus { font-size: 19px; letter-spacing: -.065em; }
  .bubble.operation .value-token { font-size: 20px; letter-spacing: -.06em; }
  .bubble.operation .value-token.len-6,
  .bubble.operation .value-token.len-7plus { font-size: 18px; letter-spacing: -.07em; }
}
@media (max-width: 520px) {
  .card, .modal { padding: 22px; border-radius: 22px; }
  #hud { gap: 8px; }
  .hud-value { font-size: 20px; }
  #promptBar { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
  <section id="welcomeScreen" class="screen center-screen active" aria-label="欢迎界面">
    <div class="card">
      <img class="game-logo" src="assets/images/logo_title.svg" alt="数字阶梯"><h1 class="logo-fallback">数字阶梯</h1>
      <img class="cover-hero" src="assets/images/cover_animated.gif" alt="数字阶梯动态封面">
      <p>画面中会出现若干包含数字的气泡。请判断数字大小，并按照从小到大的顺序依次点击。</p>
      <p class="small">点击封面或空白处关闭欢迎界面，并开启新手引导。</p>
    </div>
  </section>

  <section id="guideScreen" class="screen center-screen" aria-label="引导演示">
    <div class="card">
      <h2>引导演示</h2>
      <p id="guideText">请按照从数字小到大顺序点击气泡。</p>
      <div id="guideStage">
        <button id="guideBubbleSmall" class="bubble guide-bubble" style="left:36%;top:52%">2</button>
        <button id="guideBubbleLarge" class="bubble guide-bubble" style="left:64%;top:52%">8</button>
      </div>
      <p class="small">正确点击后气泡会炸开并消失；错误点击在正式训练中会导致本关卡失败。</p>
    </div>
  </section>

  <section id="choiceScreen" class="screen center-screen" aria-label="难度选择">
    <div class="card">
      <h2>选择难度</h2>
      <p>选择本次训练的起始关卡。玩法、排序规则和原数值表不变，只决定从哪一关开始。</p>
      <div class="difficulty-grid" role="group" aria-label="难度选择">
        <button type="button" class="difficulty-card" data-difficulty="easy" aria-label="容易难度，从第 1 关开始">
          <strong>容易</strong>
          <span>从第 1 关开始<br>基础数字排序</span>
        </button>
        <button type="button" class="difficulty-card" data-difficulty="normal" aria-label="普通难度，从第 15 关开始">
          <strong>普通</strong>
          <span>从第 15 关开始<br>更密集的气泡布局</span>
        </button>
        <button type="button" class="difficulty-card" data-difficulty="hard" aria-label="困难难度，从第 30 关开始">
          <strong>困难</strong>
          <span>从第 30 关开始<br>更高数量与复杂度</span>
        </button>
      </div>
      <p class="small difficulty-note">失败后会重新挑战当前难度组；“重新训练”会回到所选难度的起始关卡。</p>
      <button id="replayGuideBtn" class="secondary">重新演示</button>
    </div>
  </section>

  <section id="gameScreen" class="screen" aria-label="主游戏界面">

    game: GAME_DATA.meta && GAME_DATA.meta.gameName || '数字阶梯',
    difficulty: state.difficulty,
    startLevel: state.difficulty && state.difficulty.startLevel,
    totalScore: state.totalScore,
    history: state.history.slice(),
    completedAt: new Date().toISOString()
  };
  window.dispatchEvent(new CustomEvent('digital-ladder-complete', { detail }));
  if (NEXT_GAME_URL) {
    window.location.href = NEXT_GAME_URL;
    return;
  }
  showModal('已完成数字阶梯', `<p>已触发进入下一个游戏的完成事件。</p><p class="small">当前单独运行环境未配置 next 参数，因此不会跳转。嵌入平台可监听 <code>digital-ladder-complete</code> 事件，或在 URL 中加入 <code>?next=...</code>。</p>`, [
    { text: '重新训练', onClick: restartTraining },
    { text: '重新演示', secondary: true, onClick: startGuide }
  ]);
}
function pauseGame() {
  if (state.roundFinalized) return;
  state.paused = true;
  showModal('暂停', `
    <p>游戏已暂停。</p>
    <div class="modal-row"><span>声音大小</span><input id="volumeRange" type="range" min="0" max="1" step="0.01" value="${state.volume}"></div>
    <div class="modal-row"><label><input id="muteCheck" type="checkbox" ${state.muted ? 'checked' : ''}> 静音</label></div>
  `, [
    { text: '继续游戏', onClick: () => { applyAudioControls(); state.paused = false; closeModal(); } },
    { text: '帮助 / 重新演示', secondary: true, onClick: () => { applyAudioControls(); clearInterval(state.timer); clearPendingTimeouts(); startGuide(); } }
  ]);
  schedule(() => {
    const v = $('volumeRange');
    const m = $('muteCheck');
    if (v) v.addEventListener('input', () => { state.volume = Number(v.value); updateAudioVolumes(); });
    if (m) m.addEventListener('change', () => { state.muted = m.checked; updateAudioVolumes(); });
  }, 0);
}
function applyAudioControls() {
  const v = $('volumeRange');
  const m = $('muteCheck');
  if (v) state.volume = Number(v.value);
  if (m) state.muted = m.checked;
  updateAudioVolumes();
}
function updateAudioVolumes() {
  for (const audio of audioPool.values()) audio.volume = state.muted ? 0 : state.volume;
}
function getAudio(name) {
  if (!audioSources[name] || typeof Audio === 'undefined') return null;
  if (!audioPool.has(name)) {
    const audio = new Audio(audioSources[name]);
    audio.preload = 'auto';
    audio.volume = state.muted ? 0 : state.volume;
    audioPool.set(name, audio);
  }
  return audioPool.get(name);
}
function playSfx(name) {
  if (state.muted || state.volume <= 0) return;
  const audio = getAudio(name);
  if (audio) {
    try {
      audio.pause();
      audio.currentTime = 0;
      audio.volume = state.volume;
      const result = audio.play();
      if (result && typeof result.catch === 'function') result.catch(() => playToneFallback(name));
      return;
    } catch (_) {
      playToneFallback(name);
      return;
    }
  }
  playToneFallback(name);
}
function ensureAudio() {
  const AudioCtor = window.AudioContext || window.webkitAudioContext;
  if (!state.audioCtx && AudioCtor) state.audioCtx = new AudioCtor();
}
function playToneFallback(name) {
  const tone = audioFallbackTone[name] || [520, .04];
  playTone(tone[0], tone[1]);
}
function playTone(freq, duration) {
  if (state.muted || state.volume <= 0) return;
  try {
    ensureAudio();
    if (!state.audioCtx) return;
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.frequency.value = freq;
    gain.gain.value = state.volume * 0.035;
    osc.connect(gain);
    gain.connect(state.audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, state.audioCtx.currentTime + duration);
    osc.stop(state.audioCtx.currentTime + duration);
  } catch (_) {}
}
function warmAudio() {
  Object.keys(audioSources).forEach(name => getAudio(name));
  try {
    ensureAudio();
    if (state.audioCtx && state.audioCtx.state === 'suspended') state.audioCtx.resume();
  } catch (_) {}
}

let guideStep = 0;
function startGuide() {
  clearInterval(state.timer);
  clearPendingTimeouts();
  state.paused = false;
  state.inputLocked = true;
  closeModal();
  guideStep = 0;
  resetGuideBubbles();
  renderGuide();
  showScreen('guideScreen');
}
function resetGuideBubbles() {
  const entries = [
    [$('guideBubbleSmall'), '2'],
    [$('guideBubbleLarge'), '8']
  ];
  entries.forEach(([b, value]) => {
    b.classList.remove('guide-highlight', 'correct', 'wrong', 'popped', 'clicked', 'selected');
    b.disabled = true;
    b.dataset.clicked = '0';
    b.dataset.popStarted = '0';
    b.innerHTML = renderBubbleContent(value);
    b.setAttribute('aria-label', `气泡 ${value}`);
  });
}
function renderGuide() {
  const text = $('guideText');
  const b1 = $('guideBubbleSmall');
  const b2 = $('guideBubbleLarge');
  b1.classList.remove('guide-highlight');
  b2.classList.remove('guide-highlight');
  b1.disabled = true;
  b2.disabled = true;

  if (guideStep === 0) {
    resetGuideBubbles();
    text.textContent = '请按照从数字小到大顺序点击气泡。';
    schedule(() => { if ($('guideScreen').classList.contains('active') && guideStep === 0) { guideStep = 1; renderGuide(); } }, 3000);
  } else if (guideStep === 1) {
    text.textContent = '这是较小的数字，请点击它。';
    b1.classList.add('guide-highlight');
    b1.disabled = false;
  } else if (guideStep === 2) {
    text.textContent = '这是较大的数字，请继续点击它。';
    b1.classList.add('correct', 'popped', 'clicked');
    b1.disabled = true;
    b2.classList.add('guide-highlight');
    b2.disabled = false;
  } else {
    playSfx('levelPass');
    syncDifficultyButtons();
    showScreen('choiceScreen');
  }
}
function handleGuideBubble(which) {
  if (which === 'small' && guideStep === 1) {
    const b = $('guideBubbleSmall');
    b.disabled = true;
    b.classList.add('clicked', 'correct');
    playSfx('correct');
    popBubble(b, 260);
    schedule(() => { guideStep = 2; renderGuide(); }, 240);
  }
  if (which === 'large' && guideStep === 2) {
    const b = $('guideBubbleLarge');
    b.disabled = true;
    b.classList.add('clicked', 'correct');
    playSfx('correct');
    popBubble(b, 260);
    schedule(() => { guideStep = 3; renderGuide(); }, 240);
  }
}
function validateGameData() {
  const errors = [];
  if (!levels.length) errors.push('Level 表为空。');
  for (const diff of DIFFICULTIES) {
    if (!levels.some(level => Number(level.Level) === Number(diff.startLevel))) errors.push(`${diff.label}难度起始关卡 ${diff.startLevel} 不存在。`);
  }
  const floorIds = new Set((GAME_DATA.Floor || []).map(x => Number(x.ID)));
  const symbolIds = new Set((GAME_DATA.Symbol || []).map(x => Number(x.ID)));
  for (const level of levels) {
    const label = `关卡 ${level.Level}`;
    const total = Number(level.TotalNum || 0);
    const bubbles = Number(level.BubbleNumber || 0);
    if (!symbolIds.has(Number(level.SymbolNumber))) errors.push(`${label} 引用了不存在的符号模式 ${level.SymbolNumber}。`);
    if (bubbles > 0 && bubbles !== total) errors.push(`${label} BubbleNumber(${bubbles}) 与 TotalNum(${total}) 不一致。`);
    if (!Array.isArray(level.Blocks) || !level.Blocks.length) errors.push(`${label} Blocks 为空。`);
    else if (!level.Blocks.some(id => floorIds.has(Number(id)))) errors.push(`${label} Blocks 未引用有效布局。`);
    if (Number(level.Time || 0) <= 0) errors.push(`${label} Time 必须大于 0。`);
  }
  for (const symbol of GAME_DATA.Symbol || []) {
    if (![0,1,2,3].includes(Number(symbol.Form))) errors.push(`符号模式 ${symbol.ID} 的 Form 非法：${symbol.Form}。`);
    if (![0,1,2].includes(Number(symbol.Symbol1))) errors.push(`符号模式 ${symbol.ID} 的 Symbol1 非法：${symbol.Symbol1}。`);
  }
  return errors;
}
function init() {
  initSeed();
  $('welcomeScreen').addEventListener('click', (event) => {
    if (!$('welcomeScreen').classList.contains('active')) return;
    if (event.target.closest('button, a, input, select, textarea')) return;
    warmAudio();
    startGuide();
  }, { once: false });
  const enterTrainingBtn = $('enterTrainingBtn');
  if (enterTrainingBtn) enterTrainingBtn.addEventListener('click', () => { warmAudio(); restartTraining(); });
  document.querySelectorAll('[data-difficulty]').forEach(btn => {
    btn.addEventListener('click', () => startTrainingWithDifficulty(btn.dataset.difficulty));
  });
  $('replayGuideBtn').addEventListener('click', startGuide);
  syncDifficultyButtons();
  $('pauseBtn').addEventListener('click', pauseGame);
  $('guideBubbleSmall').addEventListener('click', () => handleGuideBubble('small'));
  $('guideBubbleLarge').addEventListener('click', () => handleGuideBubble('large'));
  resetGuideBubbles();
  showScreen('welcomeScreen');
  const errors = validateGameData();
  if (errors.length) {
    schedule(() => showModal('配置校验失败', `<p>发现 ${errors.length} 个配置问题。</p><p class="small">${errors.slice(0, 8).map(escapeHtml).join('<br>')}</p>`, [
      { text: '继续查看', onClick: closeModal }
    ]), 0);
  }
}
window.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
