<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数字阶梯</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Microsoft YaHei", system-ui, sans-serif; color: #172033; background: #f4f7fb; display: grid; place-items: center; }
    main { width: min(980px, calc(100vw - 28px)); display: grid; grid-template-rows: auto 1fr auto; gap: 14px; }
    header, section, footer { background: #fff; border: 1px solid #dbe3ef; border-radius: 8px; padding: 16px; box-shadow: 0 14px 36px rgba(20,31,48,.08); }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { margin: 0; font-size: 28px; }
    .board { min-height: 560px; position: relative; background: linear-gradient(#eef6ff, #f8fbff); overflow: hidden; }
    .bubble { position: absolute; width: 74px; height: 74px; border-radius: 50%; border: 3px solid #fff; background: #1f6feb; color: #fff; font-size: 28px; font-weight: 900; box-shadow: 0 10px 22px rgba(31,111,235,.24); cursor: pointer; }
    .bubble.done { background: #10a37f; }
    .bubble.wrong { background: #d92d20; }
    .hud { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    .hud b { font-size: 24px; }
    footer { display: flex; justify-content: space-between; color: #536173; align-items: center; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 800; background: #172033; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>数字阶梯</h1>
      <div class="hud">
        <span>等级 <b id="level">1</b></span>
        <span>正确小关 <b id="correct">0</b></span>
        <span id="feedback">按从小到大点击气泡数字</span>
      </div>
    </header>
    <section id="board" class="board" aria-live="polite"></section>
    <footer>
      <span>源合同：P1数字阶梯数值.xlsm / 100关 / 数字气泡升序点击</span>
      <button id="reset">重新开始</button>
    </footer>
  </main>
  <script type="module">
    import { buildNumberLadderRound, completeNumberLadderLevel, hydrateNumberLadderData, nextNumberLadderLevel, selectNumberBubble } from './rules.mjs';

    const raw = await fetch('./data.json').then((res) => res.json());
    const { floors, levels, symbols } = hydrateNumberLadderData(raw);
    let currentLevel = 1;
    let correctRounds = 0;
    let wrong = 0;
    let selected = [];
    let round = null;
    let failures = 0;
    let levelStartedAt = performance.now();
    const board = document.getElementById('board');
    const feedback = document.getElementById('feedback');

    function startRound() {
      const level = levels[currentLevel - 1];
      const floor = floors[(currentLevel - 1) % floors.length];
      const symbol = symbols[(currentLevel - 1) % symbols.length];
      selected = [];
      levelStartedAt = performance.now();
      round = buildNumberLadderRound(level, floor, symbol);
      document.getElementById('level').textContent = currentLevel;
      document.getElementById('correct').textContent = correctRounds;
      board.innerHTML = '';
      for (const bubble of round.bubbles) {
        const btn = document.createElement('button');
        btn.className = 'bubble';
        btn.textContent = bubble.value;
        btn.style.left = `${Math.min(88, bubble.position.col * 8)}%`;
        btn.style.top = `${Math.min(82, bubble.position.row * 8)}%`;
        btn.addEventListener('click', () => choose(btn, bubble.id));
        board.append(btn);
      }
    }
    function settleIfNeeded() {
      const level = levels[currentLevel - 1];
      if (correctRounds >= level.missionPass || wrong > level.fault) {
        const elapsedSeconds = (performance.now() - levelStartedAt) / 1000;
        const done = completeNumberLadderLevel({ level, correctRounds, wrongCount: wrong, remainingTime: level.time - elapsedSeconds });
        const next = nextNumberLadderLevel({ level: currentLevel, passed: done.passed, consecutiveFailures: failures });
        failures = next.consecutiveFailures;
        currentLevel = next.nextLevel;
        correctRounds = 0;
        wrong = 0;
      }
      startRound();
    }
    function choose(button, id) {
      const result = selectNumberBubble(round, selected, id);
      if (!result.correct) {
        button.classList.add('wrong');
        wrong += 1;
        feedback.textContent = '顺序错误，本小关重新开始';
        window.setTimeout(settleIfNeeded, 400);
        return;
      }
      selected = result.selectedIds;
      button.classList.add('done');
      if (result.complete) {
        correctRounds += 1;
        feedback.textContent = '完成一组';
        window.setTimeout(settleIfNeeded, 400);
      }
    }
    document.getElementById('reset').addEventListener('click', () => { currentLevel = 1; correctRounds = 0; wrong = 0; failures = 0; startRound(); });
    startRound();
  </script>
</body>
</html>
