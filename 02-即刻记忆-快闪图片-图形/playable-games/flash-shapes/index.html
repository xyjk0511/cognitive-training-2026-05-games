<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快闪图形 - 三档难度版版本选择</title>
  <link rel="stylesheet" href="shared/style.css">
  <style>
    body { overflow:auto; }
    #app { min-height:100vh; }
    .stage { min-height:620px; }
    a.primary-btn { display:inline-grid; place-items:center; text-decoration:none; }
    .stage, #welcomeScreen, #menuScreen { background-image:url("assets/ui/bg_menu.svg"); }
  </style>
</head>
<body>
<div id="app">
  <main class="stage">
    <section class="screen active">
      <div class="center-stack">
        <img class="title-logo" src="assets/ui/title_logo.svg" alt="快闪图形">
        <img class="mascot-img" src="assets/mascot/xkk_idle.svg" alt="角色小康康">
        <div class="mascot-name">选择版本</div>
        <div class="menu-actions">
          <a class="primary-btn" href="儿童版/index.html">儿童版</a>
          <a class="primary-btn" href="成人版/index.html">成人版</a>
        </div>
        <div style="color:rgba(255,255,255,.78);font-weight:900">无需联网，直接在浏览器中打开对应版本即可运行。</div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
