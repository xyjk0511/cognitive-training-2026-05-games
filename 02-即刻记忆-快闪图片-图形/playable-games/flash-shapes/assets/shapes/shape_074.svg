<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="紫五角星，斜条纹">
  <defs>
    
    <linearGradient id="s074_grad" x1="30" y1="18" x2="210" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bd9cff"/>
      <stop offset=".45" stop-color="#9A68FF"/>
      <stop offset="1" stop-color="#8157d6"/>
    </linearGradient>
    <radialGradient id="s074_shine" cx="34%" cy="22%" r="64%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".48"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s074_inner" x1="0" x2="1"><stop stop-color="#bd9cff"/><stop offset="1" stop-color="#8157d6"/></linearGradient>
    
        <pattern id="s074_stripe" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45 128 128)">
          <rect width="34" height="34" fill="#9A68FF"/>
          <rect x="0" width="12" height="34" fill="#bd9cff" opacity=".48"/>
          <rect x="20" width="5" height="34" fill="#fff" opacity=".14"/>
        </pattern>
        
    <filter id="s074_shadow" x="-32" y="-28" width="320" height="320" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="10" flood-color="#1a2034" flood-opacity=".28"/>
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".20"/>
    </filter>
    <filter id="s074_edge" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant=".55" specularExponent="16" lighting-color="#fff" result="spec">
        <fePointLight x="70" y="30" z="180"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3=".42" k4="0"/>
    </filter>
  </defs>
  <g filter="url(#s074_shadow)">
    <g filter="url(#s074_edge)"><polygon class="shape-core" fill="url(#s074_stripe)" stroke="#dccbff" stroke-width="8" stroke-linejoin="round" points="128,18 153,89 228,91 169,136 189,218 128,172 67,218 87,136 28,91 103,89"/></g>
    <path d="M54 74 C82 38, 136 30, 173 48" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".24"/>
    <circle cx="75" cy="57" r="7" fill="#fff" opacity=".35"/>
    <circle cx="180" cy="198" r="5" fill="#fff" opacity=".22"/>
  </g>
</svg>
