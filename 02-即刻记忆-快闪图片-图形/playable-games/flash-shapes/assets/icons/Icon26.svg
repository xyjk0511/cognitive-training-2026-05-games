<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="绿五边形，空">
  <defs>
    
    <linearGradient id="s026_grad" x1="30" y1="18" x2="210" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86e1b3"/>
      <stop offset=".45" stop-color="#45D28B"/>
      <stop offset="1" stop-color="#39b074"/>
    </linearGradient>
    <radialGradient id="s026_shine" cx="34%" cy="22%" r="64%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".48"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s026_inner" x1="0" x2="1"><stop stop-color="#86e1b3"/><stop offset="1" stop-color="#39b074"/></linearGradient>
    
    <filter id="s026_shadow" x="-32" y="-28" width="320" height="320" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="10" flood-color="#1a2034" flood-opacity=".28"/>
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".20"/>
    </filter>
    <filter id="s026_edge" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant=".55" specularExponent="16" lighting-color="#fff" result="spec">
        <fePointLight x="70" y="30" z="180"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3=".42" k4="0"/>
    </filter>
  </defs>
  <g filter="url(#s026_shadow)">
