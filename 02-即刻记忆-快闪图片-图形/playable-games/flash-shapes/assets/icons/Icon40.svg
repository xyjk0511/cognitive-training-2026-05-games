<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="橙铜钱形，空">
  <defs>
    
    <linearGradient id="s040_grad" x1="30" y1="18" x2="210" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffbd77"/>
      <stop offset=".45" stop-color="#FF9A2E"/>
      <stop offset="1" stop-color="#d68126"/>
    </linearGradient>
    <radialGradient id="s040_shine" cx="34%" cy="22%" r="64%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".48"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s040_inner" x1="0" x2="1"><stop stop-color="#ffbd77"/><stop offset="1" stop-color="#d68126"/></linearGradient>
    
    <filter id="s040_shadow" x="-32" y="-28" width="320" height="320" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="10" flood-color="#1a2034" flood-opacity=".28"/>
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".20"/>
    </filter>
    <filter id="s040_edge" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant=".55" specularExponent="16" lighting-color="#fff" result="spec">
        <fePointLight x="70" y="30" z="180"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3=".42" k4="0"/>
    </filter>
  </defs>
  <g filter="url(#s040_shadow)">
    <g filter="url(#s040_edge)">
        <rect class="shape-core" fill="url(#s040_grad)" stroke="#ffdcb7" stroke-width="8" stroke-linejoin="round" x="42" y="42" width="172" height="172" rx="46"/>
        <rect x="99" y="99" width="58" height="58" rx="10" fill="#fff" opacity=".92" stroke="#e5c6a4" stroke-width="5"/>
        <rect x="107" y="107" width="42" height="42" rx="7" fill="url(#s040_inner)" opacity=".28"/>
        </g>
    <path d="M54 74 C82 38, 136 30, 173 48" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".24"/>
    <circle cx="75" cy="57" r="7" fill="#fff" opacity=".35"/>
    <circle cx="180" cy="198" r="5" fill="#fff" opacity=".22"/>
  </g>
</svg>
