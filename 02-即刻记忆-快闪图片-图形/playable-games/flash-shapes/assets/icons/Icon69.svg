<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="紫铜钱形，正方纹">
  <defs>
    
    <linearGradient id="s069_grad" x1="30" y1="18" x2="210" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bd9cff"/>
      <stop offset=".45" stop-color="#9A68FF"/>
      <stop offset="1" stop-color="#8157d6"/>
    </linearGradient>
    <radialGradient id="s069_shine" cx="34%" cy="22%" r="64%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".48"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s069_inner" x1="0" x2="1"><stop stop-color="#bd9cff"/><stop offset="1" stop-color="#8157d6"/></linearGradient>
    
        <pattern id="s069_checker" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(45 128 128)">
          <rect width="42" height="42" fill="#9A68FF"/>
          <rect x="0" y="0" width="21" height="21" fill="#ac83ff" opacity=".72"/>
          <rect x="21" y="21" width="21" height="21" fill="#bd9cff" opacity=".55"/>
          <path d="M0 42h42M42 0v42" stroke="#fff" stroke-opacity=".11" stroke-width="2"/>
        </pattern>
        
    <filter id="s069_shadow" x="-32" y="-28" width="320" height="320" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="10" flood-color="#1a2034" flood-opacity=".28"/>
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".20"/>
    </filter>
    <filter id="s069_edge" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant=".55" specularExponent="16" lighting-color="#fff" result="spec">
        <fePointLight x="70" y="30" z="180"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3=".42" k4="0"/>
    </filter>
  </defs>
  <g filter="url(#s069_shadow)">
    <g filter="url(#s069_edge)">
        <rect class="shape-core" fill="url(#s069_checker)" stroke="#dccbff" stroke-width="8" stroke-linejoin="round" x="42" y="42" width="172" height="172" rx="46"/>
        <rect x="99" y="99" width="58" height="58" rx="10" fill="#fff" opacity=".92" stroke="#c6b6e5" stroke-width="5"/>
        <rect x="107" y="107" width="42" height="42" rx="7" fill="url(#s069_inner)" opacity=".28"/>
        </g>
    <path d="M54 74 C82 38, 136 30, 173 48" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".24"/>
    <circle cx="75" cy="57" r="7" fill="#fff" opacity=".35"/>
    <circle cx="180" cy="198" r="5" fill="#fff" opacity=".22"/>
  </g>
</svg>
