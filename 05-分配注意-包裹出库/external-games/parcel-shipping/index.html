<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>包裹出库训练 React 单文件版</title>
<style>
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #eef4ff;
  background: radial-gradient(circle at top, #303b52 0%, #151b26 60%, #0f131b 100%);
  overflow: hidden;
}
button {
  border: 0;
  border-radius: 10px;
  padding: 9px 14px;
  font-weight: 800;
  color: #eaf2ff;
  background: rgba(255,255,255,0.12);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
  cursor: pointer;
}
button:hover { background: rgba(255,255,255,0.18); }
button.primary { background: linear-gradient(180deg, #62c46f, #3ba856); color: white; }
button.danger { background: linear-gradient(180deg, #e65a5a, #bd3b3b); color: white; }
.app-shell { min-height: 100%; display: flex; flex-direction: column; padding: 14px; gap: 12px; }
.top-bar {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 12px;
  z-index: 5;
}
.brand {
  min-width: 210px;
  padding: 12px 16px;
  border-radius: 18px;
  background: rgba(0,0,0,0.24);
  border: 1px solid rgba(255,255,255,0.11);
}
.brand-title { font-size: 18px; font-weight: 950; letter-spacing: 0.04em; }
.brand-sub { margin-top: 3px; font-size: 12px; color: rgba(238,244,255,0.70); }
.hud {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, minmax(92px, 1fr));
  gap: 8px;
}
.hud-item {
  min-height: 58px;
  padding: 10px 12px;
  border-radius: 16px;
  background: rgba(0,0,0,0.22);
  border: 1px solid rgba(255,255,255,0.10);
}
.hud-item span { display: block; font-size: 12px; color: rgba(238,244,255,0.66); }
.hud-item b { display: block; margin-top: 3px; font-size: 18px; }
.controls { display: flex; align-items: center; gap: 8px; }
.game-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  border-radius: 22px;
  overflow: hidden;
  background: rgba(0,0,0,0.28);
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: 0 22px 70px rgba(0,0,0,0.36);
}
.game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.status-line {
  position: absolute;
  left: 18px;
  bottom: 14px;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(10,14,22,0.66);
  color: rgba(238,244,255,0.82);
  font-size: 13px;
  pointer-events: none;
}
.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(3,8,14,0.62);
  backdrop-filter: blur(8px);
}
.dialog {
  width: min(620px, 94vw);
  max-height: 90vh;
  overflow: auto;
  padding: 20px;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(43,54,76,0.98), rgba(26,33,47,0.98));
  border: 1px solid rgba(255,255,255,0.14);
  box-shadow: 0 28px 90px rgba(0,0,0,0.55);
}
.dialog h2 { margin: 0 0 12px; font-size: 26px; }
.dialog-body { color: rgba(238,244,255,0.88); line-height: 1.68; font-size: 15px; }
.dialog-body p { margin: 8px 0; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.metric-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 14px 0; }
.metric { padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.08); }
.metric span { display: block; font-size: 12px; color: rgba(238,244,255,0.62); }
.metric b { display: block; margin-top: 4px; font-size: 24px; color: #fff; }
.badge { display: inline-block; margin-right: 8px; padding: 3px 8px; border-radius: 999px; background: rgba(112,172,255,0.20); color: #b9d7ff; font-weight: 800; font-size: 12px; }
.guide-image { display: block; width: 100%; max-height: 440px; object-fit: contain; border-radius: 14px; margin-top: 10px; background: rgba(0,0,0,0.24); }
@media (max-width: 900px) {
  body { overflow: auto; }
  .app-shell { min-height: 100%; }
  .top-bar { flex-direction: column; }
  .hud { grid-template-columns: repeat(3, minmax(90px, 1fr)); }
  .controls { flex-wrap: wrap; }
  .game-wrap { min-height: 58vh; }
  .metric-row { grid-template-columns: 1fr; }
}

</style>
</head>
