<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>骰子求和｜React单文件版</title>
  <style>
:root {
  --bg: #f5f7fb;
  --panel: rgba(255, 255, 255, 0.92);
  --text: #172033;
  --muted: #6d7484;
  --line: #d9deea;
  --shadow: 0 20px 60px rgba(17, 24, 39, 0.14);
  --radius: 22px;
  --green: #22a866;
  --red: #e14d4d;
  --blue: #3d66d6;
  --yellow: #f5b945;
  --dark: #111827;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  background:
    radial-gradient(circle at 10% 10%, rgba(61,102,214,0.18), transparent 32%),
    radial-gradient(circle at 90% 20%, rgba(245,185,69,0.20), transparent 30%),
    linear-gradient(145deg, #eef3ff 0%, #f8fafc 50%, #edf7f2 100%);
  overflow-x: hidden;
}
button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.55; }
#app { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  display: grid;
  grid-template-columns: 1fr auto auto auto auto;
  gap: 14px;
  align-items: center;
  padding: 18px clamp(18px, 4vw, 48px);
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 { margin: 0; font-size: clamp(24px, 4vw, 40px); letter-spacing: 0.02em; }
.brand span { color: var(--muted); font-size: 14px; }
.stat {
  min-width: 108px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.70);
  border-radius: 16px;
  padding: 9px 12px;
  text-align: center;
  box-shadow: 0 8px 28px rgba(17,24,39,0.05);
}
.stat strong { display: block; font-size: 20px; line-height: 1.1; }
.stat span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.icon-button {
  border: 0;
  border-radius: 16px;
  padding: 12px 16px;
  background: var(--dark);
  color: white;
  box-shadow: 0 12px 28px rgba(17,24,39,0.18);
}
.icon-button.secondary { background: white; color: var(--text); border: 1px solid var(--line); box-shadow: none; }
.screen { display: none; flex: 1; width: min(1160px, calc(100% - 32px)); margin: 0 auto 32px; }
.screen.active { display: block; }
.hero, .panel, .game-shell {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,0.75);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
}
.hero { min-height: 620px; display: grid; grid-template-columns: 1.05fr 0.95fr; overflow: hidden; }
.hero-copy { padding: clamp(28px, 5vw, 64px); display: flex; flex-direction: column; justify-content: center; }
.hero-copy h2 { font-size: clamp(36px, 6vw, 72px); line-height: 1.03; margin: 0 0 20px; }
.hero-copy p { color: var(--muted); font-size: 18px; line-height: 1.8; margin: 0 0 26px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.primary, .ghost, .danger, .success {
  border: 0;
  border-radius: 16px;
  padding: 13px 20px;
  font-weight: 700;
  box-shadow: 0 12px 26px rgba(17,24,39,0.12);
}
.primary { background: var(--blue); color: white; }
.success { background: var(--green); color: white; }
.danger { background: var(--red); color: white; }
.ghost { background: white; color: var(--text); border: 1px solid var(--line); box-shadow: none; }
.hero-art { position: relative; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(61,102,214,0.08), rgba(34,168,102,0.10)); }
.hero-card { width: min(430px, 86%); padding: 28px; border-radius: 28px; background: rgba(255,255,255,0.88); box-shadow: 0 22px 60px rgba(17,24,39,0.16); }
.hero-card .dice-row { margin: 8px 0 24px; justify-content: center; }
.hero-card .answer-grid { opacity: 1; transform: none; }
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 28px; }
.info-box { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: rgba(255,255,255,0.72); }
.info-box strong { display: block; font-size: 18px; }
.info-box span { color: var(--muted); font-size: 13px; }
.game-shell { min-height: 650px; padding: clamp(18px, 3vw, 32px); display: grid; grid-template-rows: auto 1fr auto; gap: 20px; overflow: hidden; }
.status-row { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; align-items: stretch; }
.status-card { border: 1px solid var(--line); background: rgba(255,255,255,0.70); border-radius: 18px; padding: 14px 16px; }
.status-card h3 { margin: 0 0 8px; font-size: 18px; }
.progress-track { height: 12px; border-radius: 999px; background: #e4e8f0; overflow: hidden; }
.progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--green)); transition: width 0.25s ease; }
.meta-line { color: var(--muted); font-size: 13px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 10px; }
.timer-wrap { display: flex; gap: 14px; align-items: center; }
.timer-ring {
  width: 74px;
  height: 74px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--blue) 360deg, #e4e8f0 0deg);
  position: relative;
}
.timer-ring::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: white; }
.timer-ring strong { position: relative; font-size: 20px; }
.timer-label { flex: 1; }
.timer-label strong { display: block; font-size: 18px; }
.timer-label span { color: var(--muted); font-size: 13px; }
.play-area { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px; position: relative; min-height: 360px; }
.prompt { min-height: 32px; color: var(--muted); text-align: center; font-size: 17px; }
.formula { min-height: 34px; font-size: clamp(24px, 4vw, 40px); font-weight: 800; letter-spacing: 0.02em; }
.dice-row { display: flex; flex-wrap: wrap; align-items: center; gap: clamp(12px, 3vw, 24px); min-height: 110px; }
.die {
  width: clamp(68px, 10vw, 96px);
  height: clamp(68px, 10vw, 96px);
  border-radius: 18px;
  background: linear-gradient(145deg, #ffffff, #f2f4f8);
  border: 1px solid #dfe3ed;
  box-shadow: 0 16px 35px rgba(17,24,39,0.16), inset 0 2px 0 rgba(255,255,255,0.85);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  padding: 12px;
  transform-origin: center;
}
.die.enter { animation: flyIn 0.2s cubic-bezier(.2,.85,.22,1.15) both; }
.die.exit { animation: flyOut 0.2s ease-in both; }
.pip { place-self: center; width: clamp(8px, 1.25vw, 13px); height: clamp(8px, 1.25vw, 13px); border-radius: 50%; background: #151922; opacity: 0; box-shadow: inset 0 1px 1px rgba(255,255,255,0.25); }
.pip.active { opacity: 1; }
.answer-grid { width: min(720px, 100%); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; opacity: 0; transform: translateY(12px); transition: opacity 0.2s ease, transform 0.2s ease; }
.answer-grid.show { opacity: 1; transform: translateY(0); }
.answer {
  border: 1px solid var(--line);
  border-radius: 18px;
  min-height: 76px;
  background: white;
  color: var(--text);
  font-size: clamp(24px, 3.2vw, 36px);
  font-weight: 850;
  box-shadow: 0 12px 26px rgba(17,24,39,0.08);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.answer:hover { transform: translateY(-2px); box-shadow: 0 18px 34px rgba(17,24,39,0.12); }
.answer.correct { border-color: rgba(34,168,102,0.70); background: #e8f8ef; color: #116b40; }
.answer.wrong { border-color: rgba(225,77,77,0.70); background: #fff0f0; color: #a62f2f; }
.answer.correct.flash { animation: flashGreen 0.25s ease-in-out 6 alternate; }
.answer.wrong.flash { animation: flashRed 0.25s ease-in-out 6 alternate; }
.feedback-line { min-height: 30px; text-align: center; font-weight: 700; }
.feedback-line.good { color: var(--green); }
.feedback-line.bad { color: var(--red); }
.panel { padding: clamp(24px, 5vw, 48px); }
.panel h2 { font-size: clamp(30px, 5vw, 52px); margin: 0 0 14px; }
.panel p { color: var(--muted); line-height: 1.8; margin: 0 0 20px; }
.tutorial-stage { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: stretch; }
.tutorial-board { border: 1px solid var(--line); background: rgba(255,255,255,0.7); border-radius: 22px; padding: 28px; min-height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; position: relative; }
.tutorial-text { font-size: clamp(22px, 4vw, 40px); font-weight: 850; margin: 0 0 12px; }
.tutorial-desc { color: var(--muted); line-height: 1.7; font-size: 17px; }
.pointer { position: absolute; right: 13%; bottom: 17%; font-size: 44px; animation: tap 0.85s ease-in-out infinite alternate; display: none; }
.pointer.show { display: block; }
.modal-root { position: fixed; inset: 0; display: none; z-index: 50; }
.modal-root.show { display: block; }
.backdrop { position: absolute; inset: 0; background: rgba(17,24,39,0.52); backdrop-filter: blur(8px); }
.modal { position: relative; z-index: 1; width: min(560px, calc(100% - 32px)); margin: min(10vh, 80px) auto; background: white; border-radius: 24px; box-shadow: 0 24px 80px rgba(17,24,39,0.32); padding: 26px; }
.modal h2 { margin: 0 0 10px; font-size: 30px; }
.modal p { color: var(--muted); line-height: 1.7; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.result-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 18px 0; }
.result-card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: #f8fafc; }
.result-card strong { display: block; font-size: 24px; }
.result-card span { color: var(--muted); font-size: 13px; }
.trend { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: #f8fafc; }
.trend-bars { height: 84px; display: flex; align-items: flex-end; gap: 8px; margin-top: 12px; }
.trend-bar { flex: 1; min-width: 12px; border-radius: 999px 999px 0 0; background: linear-gradient(180deg, var(--blue), var(--green)); opacity: 0.85; }
.pause-form { display: grid; gap: 14px; margin-top: 18px; }
.pause-form label { display: grid; grid-template-columns: 90px 1fr; gap: 12px; align-items: center; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; z-index: 80; background: #111827; color: white; padding: 12px 16px; border-radius: 999px; box-shadow: 0 14px 40px rgba(17,24,39,0.24); transition: opacity 0.2s ease, transform 0.2s ease; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.hidden { display: none !important; }
.blur { filter: blur(8px); }
@keyframes flyIn { from { opacity: 0; transform: translateX(-140px) scale(0.88) rotate(-8deg); } to { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); } }
@keyframes flyOut { from { opacity: 1; transform: translateX(0) scale(1); } to { opacity: 0; transform: translateX(150px) scale(0.88) rotate(8deg); } }
@keyframes flashGreen { from { background: #e8f8ef; } to { background: #8ee1b5; } }
@keyframes flashRed { from { background: #fff0f0; } to { background: #ff9e9e; } }
@keyframes tap { from { transform: translateY(0) rotate(-12deg); } to { transform: translateY(-10px) rotate(4deg); } }
@media (max-width: 860px) {
  .topbar { grid-template-columns: 1fr 1fr; }
  .brand { grid-column: 1 / -1; }
  .stat { min-width: 0; }
  .hero, .tutorial-stage, .status-row { grid-template-columns: 1fr; }
  .answer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { min-height: auto; }
  .hero-art { padding: 30px 0; }
}
@media (max-width: 520px) {
  .topbar { gap: 8px; padding: 14px; }
  .stat { padding: 8px; }
  .icon-button { padding: 10px 12px; }
  .hero-copy, .panel, .game-shell { padding: 18px; }
  .info-grid, .result-grid { grid-template-columns: 1fr; }
  .answer { min-height: 64px; }
}

  </style>
</head>

  showModal(type, payload) {

    this.setState({
      modal: {
        type,
        payload: payload || {}

    });
  }
  closeModal() {
    this.setState({
      modal: null
    });
  }
  startNewTraining(options) {
    const skipGuide = options && options.skipGuide;
    this.stopTimer();
    this.clearPendingTimeouts();

    const progress = defaultProgress();
    if (skipGuide) progress.guideDone = true;
    this.setState({
      progress,
      run: null,
      modal: null,
      guideStep: 0,
      savedAvailable: false

        this.startLevel(0);
      } else {

    });

  continueTraining() {

      return;

    this.stopTimer();

  startGuide() {

      screen: "guide",
      guideStep: 0,
      modal: null
    });
  }
  guideNext() {
    this.playTone("click");
    this.setState(prev => ({
      guideStep: Math.min(2, prev.guideStep + 1)
    }));
  }
  guideBack() {
    this.setState(prev => ({
      guideStep: Math.max(0, prev.guideStep - 1)
    }));
  }
  finishGuide() {
    const progress = {
      ...this.state.progress,
      guideDone: true

    this.setState({
      progress

      this.persist(progress);
      this.playTone("complete");
      this.showModal("guideComplete");
    });
  }
  freshRun(levelIndex, baseProgress) {

    const progressForRun = baseProgress || this.state.progress;
    return {
      levelIndex,
      level,
      correctNeeded: level.missionPass,
      maxWrong: level.fault,
      maxAttempts: Math.max(level.missionNum, level.missionPass) + level.fault,
      correctCount: 0,
      wrongCount: 0,
      attempts: 0,

      levelStartReward: progressForRun.totalReward,

      rewardGain: 0,

      correctAnswer: 0,
      options: [],

      pausedRemaining: level.time,

      feedbackText: "",
      feedbackKind: "",
      wrongOption: null,
      showCorrect: false,
      roundId: 0

  startLevel(levelIndex) {

      return;

    this.clearPendingTimeouts();

      levelIndex: targetIndex,
      failureStreak: targetIndex > this.state.progress.levelIndex ? 0 : this.state.progress.failureStreak,

      progress,
      run,
      screen: "game",
      modal: null,
      savedAvailable: false

      this.playTone("start");
      this.startRound();
    });
  }
  startRound() {

    this.stopTimer();

    const dice = Array.from({
      length: count
    }, () => pick(level.values));
    const correctAnswer = dice.reduce((sum, value) => sum + value, 0);

      ...currentRun,
      locked: false,
      dice,
      correctAnswer,
      options: createOptions(correctAnswer),
      remaining: level.time,
      pausedRemaining: level.time,
      timerTotal: level.time,
      showOptions: false,
      exiting: false,
      formula: "",
      feedbackText: "选择所有骰子的点数之和",
      feedbackKind: "",
      wrongOption: null,
      showCorrect: false,
      roundId: currentRun.roundId + 1
    };

    this.setState({
      run: nextRun
    }, () => {
      const optionDelay = Math.max(260, nextRun.dice.length * 170);
      this.setLater(() => {
        const run = this.state.run;
        if (!run || run.roundId !== roundId || run.locked || this.state.screen !== "game" || this.state.modal) return;
        this.setState({
          run: {
            ...run,
            showOptions: true
          }

          this.startTimer(level.time);

      }, optionDelay);
    });
  }
  startTimer(seconds) {

    this.timerEndAt = performance.now() + total * 1000;
    this.setState(prev => prev.run ? {
      run: {
        ...prev.run,
        remaining: total,
        timerTotal: total

      const remaining = Math.max(0, (this.timerEndAt - performance.now()) / 1000);

        if (!prev.run) return null;
        return {
          run: {
            ...prev.run,
            remaining
          }
        };
      }, () => {
        if (remaining <= 0) this.handleTimeout();
      });
    }, 100);
  }
  stopTimer() {
    if (this.timerId) {
      window.clearInterval(this.timerId);
      this.timerId = null;
    }
  }
  chooseAnswer(option) {
    const currentRun = this.state.run;
    if (!currentRun || currentRun.locked || !currentRun.showOptions) return;
    this.unlockAudioOnGesture();
    this.stopTimer();
    const level = currentRun.level;
    const remaining = round1(currentRun.remaining);
    const used = round1(level.time - remaining);
    const correct = option === currentRun.correctAnswer;
    const nextHistoryItem = {
      level: level.level,
      correct,
      timeUsed: used,
      score: 0,
      answer: currentRun.correctAnswer,
      dice: currentRun.dice.slice()
    };
    let nextProgress = {
      ...this.state.progress
    };
    let nextRun = {
      ...currentRun,
      locked: true,
      attempts: currentRun.attempts + 1,
      showCorrect: true,
      formula: `${currentRun.dice.join(" + ")} = ${currentRun.correctAnswer}`
    };
    if (correct) {
      const surplus = Math.max(0, currentRun.correctCount + 1 - level.missionPass);
      const gained = Math.round(level.score + surplus * level.extraScore + 10);
      const reward = remaining >= level.limit ? level.rewardNum : 0;
      nextHistoryItem.score = gained;
      nextRun = {
        ...nextRun,
        correctCount: currentRun.correctCount + 1,
        levelGain: currentRun.levelGain + gained,
        rewardGain: currentRun.rewardGain + reward,
        feedbackText: `正确。用时 ${used.toFixed(1)} 秒，本题 +${gained} 分${reward ? `，奖励 +${reward}` : ""}`,
        feedbackKind: "good"
      };
      nextProgress = {
        ...nextProgress,
        totalScore: nextProgress.totalScore + gained,
        totalReward: nextProgress.totalReward + reward
      };
    } else {
      nextRun = {
        ...nextRun,
        wrongCount: currentRun.wrongCount + 1,
        wrongOption: option,
        feedbackText: `错误。正确答案是 ${currentRun.correctAnswer}。`,
        feedbackKind: "bad"
      };
    }
    nextProgress.history = nextProgress.history.concat([nextHistoryItem]).slice(-30);
    this.setState({
      progress: nextProgress,
      run: nextRun
    }, () => {
      this.persist(this.state.progress);
      this.playTone(correct ? "correct" : "wrong");
      this.setLater(() => this.animateRoundExit(() => this.evaluateRound()), 1800);
    });
  }
  animateRoundExit(callback) {
    const run = this.state.run;
    if (!run) return;
    const delay = Math.max(260, run.dice.length * 170);
    this.setState({
      run: {
        ...run,
        exiting: true,
        showOptions: false
      }
    }, () => {
      this.setLater(callback, delay);
    });
  }
  evaluateRound() {
    const run = this.state.run;
    if (!run) return;
    if (run.correctCount >= run.correctNeeded) {
      this.completeLevel();
      return;
    }
    if (run.wrongCount > run.maxWrong || run.attempts >= run.maxAttempts) {
      this.resetCurrentLevel("未达到本难度通过要求，当前难度重新开始。", "bad");
      return;
    }
    this.startRound();
  }
  handleTimeout() {
    const run = this.state.run;
    if (!run || run.locked) return;
    this.stopTimer();
    const nextRun = {
      ...run,
      locked: true,
      showCorrect: true,
      formula: `${run.dice.join(" + ")} = ${run.correctAnswer}`,
      feedbackText: "超时。当前难度重新开始。",
      feedbackKind: "bad"
    };
    this.setState({
      run: nextRun
    }, () => {
      this.playTone("timeout");
      this.setLater(() => this.animateRoundExit(() => this.resetCurrentLevel("超时，当前难度重新开始。", "bad")), 1600);
    });
  }
  resetCurrentLevel(message, kind) {
    const run = this.state.run;
    if (!run) return;
    this.stopTimer();
    const failures = (this.state.progress.failureStreak || 0) + 1;
    const nextLevelIndex = failures >= 3
      ? Math.max(0, this.state.progress.levelIndex - 3)
      : failures >= 2
        ? Math.max(0, this.state.progress.levelIndex - 1)
        : this.state.progress.levelIndex;
    const progress = {
      ...this.state.progress,
      levelIndex: nextLevelIndex,
      failureStreak: failures >= 3 ? 0 : failures,
      totalScore: run.levelStartScore,
      totalReward: run.levelStartReward
    };
    const fresh = this.freshRun(nextLevelIndex, progress);
    fresh.feedbackText = message;
    fresh.feedbackKind = kind || "";
    this.setState({
      progress,
      run: fresh
    }, () => {
      this.persist(this.state.progress);
      this.showToast(message);
      this.setLater(() => this.startRound(), 600);
    });
  }
  buildTrendBars(lastItems, level) {
    return lastItems.map(item => ({
      level: item.level,
      correct: item.correct,
      score: item.score,
      height: item.correct ? clamp(item.score / Math.max(1, level.score + level.extraScore) * 78 + 12, 14, 84) : 12,
      opacity: item.correct ? 0.9 : 0.35
    }));
  }
  completeLevel() {
    const run = this.state.run;
    if (!run) return;
    this.stopTimer();
    this.playTone("complete");
    const last = this.state.progress.history.slice(-10);
    const accuracy = last.length ? Math.round(last.filter(item => item.correct).length / last.length * 100) : 0;
    const avgTime = last.length ? round1(last.reduce((sum, item) => sum + item.timeUsed, 0) / last.length).toFixed(1) : "0.0";
    const trendBars = this.buildTrendBars(last, run.level);
    const isLast = this.state.progress.levelIndex >= LEVELS.length - 1;
    if (isLast) {
      const progress = {
        ...this.state.progress,
        completed: true
      };
      this.setState({
        progress
      }, () => {
        this.persist(this.state.progress);
        this.showModal("gameComplete", {
          totalScore: this.state.progress.totalScore,
          totalReward: this.state.progress.totalReward,
          accuracy,
          trendBars
        });
      });
      return;
    }
    this.persist(this.state.progress);
    this.showModal("levelComplete", {
      level: run.level.level,
      levelGain: run.levelGain,
      rewardGain: run.rewardGain,
      avgTime,
      trendBars
    });
  }
  pauseGame() {
    if (this.state.screen !== "game" || !this.state.run) return;
    let run = this.state.run;
    if (!run.locked && this.timerId) {
      run = {
        ...run,
        pausedRemaining: run.remaining
      };
      this.stopTimer();
    }
    this.setState({
      run
    }, () => {
      this.showModal("pause");
    });
  }
  resumeGame() {
    const run = this.state.run;
    if (!run || run.locked) {
      this.closeModal();
      return;
    }
    this.closeModal();
    this.startTimer(Math.max(0.1, run.pausedRemaining || run.remaining || run.level.time));
  }
  exportResult() {
    const payload = {
      game: GAME_DATA.meta && GAME_DATA.meta.game ? GAME_DATA.meta.game : "骰子求和",
      implementation: "React",
      finishedAt: new Date().toISOString(),
      totalScore: this.state.progress.totalScore,
      totalReward: this.state.progress.totalReward,
      completedLevels: this.state.progress.completed ? LEVELS.length : this.state.progress.levelIndex,
      recentHistory: this.state.progress.history
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {
      type: "application/json;charset=utf-8"
    });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "骰子求和_React成绩.json";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    this.showToast("成绩已导出");
  }
  handleModalAction(key) {
    if (key === "replayGuide") {
      this.closeModal();
      this.startGuide();
    } else if (key === "enterTraining") {
      this.closeModal();
      this.startLevel(0);
    } else if (key === "help") {
      this.closeModal();
      this.startGuide();
    } else if (key === "restart") {
      this.closeModal();
      this.startNewTraining({
        skipGuide: true
      });
    } else if (key === "resume") {
      this.resumeGame();
    } else if (key === "nextLevel") {
      const nextIndex = this.state.progress.levelIndex + 1;
      this.closeModal();
      this.startLevel(nextIndex);
    } else if (key === "exportResult") {
      this.exportResult();
    } else if (key === "returnHome") {
      this.closeModal();
      this.setState({
        screen: "welcome"
      }, () => this.refreshSavedAvailability());
    }
  }
  handleVolumeChange(event) {
    const volume = Number(event.target.value);
    const progress = {
      ...this.state.progress,
      volume
    };
    this.setState({
      progress
    }, () => this.persist(this.state.progress));
  }
  handleMuteChange(event) {
    const muted = event.target.checked;
    const progress = {
      ...this.state.progress,
      muted
    };
    this.setState({
      progress
    }, () => this.persist(this.state.progress));
  }
  handleKeyDown(event) {
    if (event.key === "Escape" && this.state.screen === "game" && !this.state.modal) {
      this.pauseGame();
      return;
    }
    if (this.state.screen === "game" && !this.state.modal && this.state.run && !this.state.run.locked && /^[1-4]$/.test(event.key)) {
      const index = Number(event.key) - 1;
      const option = this.state.run.options[index];
      if (typeof option === "number") this.chooseAnswer(option);

  render() {
    const {
      progress,
      screen,
      guideStep,
      run,
      modal,
      toast,
      savedAvailable

    return React.createElement("div", {
      id: "app"
    }, React.createElement(Header, {
      progress: progress,
      screen: screen,
      savedLevelCount: LEVELS.length,
      onPause: () => this.pauseGame()

      active: screen === "welcome",
      savedAvailable: savedAvailable,
      onStartGuide: () => this.startNewTraining({

      }),

        skipGuide: true
      }),

      active: screen === "guide",
      guideStep: guideStep,
      onBack: () => this.guideBack(),

}

  var root = document.getElementById('root');

    ReactDOM.createRoot(root).render(React.createElement(window.DiceSumGame));
  } else {

  }
